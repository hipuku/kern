# One job per check, named exactly as the main ruleset requires them, so a
# failure says which check broke and each can be required on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code, it never writes to the repo.
permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The token CSS is generated from src/tokens/tokens.ts but committed, so
      # that kern stays source-only with no build step for consumers. This is
      # what keeps the committed copy honest.
      - name: Token CSS in sync
        run: npm run tokens:check

      - name: ESLint
        if: always()
        run: npm run lint

      # House style does not use an em dash. Ratcheted against a baseline rather
      # than absolute: a rule that could only pass after a mechanical rewrite of
      # every file would have been turned off instead of adopted.
      - name: Prose
        if: always()
        run: npm run lint:prose

      # Markdown structure. Prettier owns wrapping and the docs standard owns
      # voice, so the rules that overlap with either are off
      # (.markdownlint-cli2.jsonc).
      - name: Markdown
        if: always()
        run: npm run lint:md

  # Every relative link and heading anchor in the docs resolves. Offline, so a
  # third-party site being down never fails a pull request.
  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress --hidden --exclude-path node_modules --exclude-path '(^|/)\.git/' './**/*.md'
          fail: true

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build Storybook
        run: npm run build-storybook

      # Story IDs come from the export name, not the displayed name, so a
      # hand-written docs link can look right and 404. Checked against the
      # index.json the build just emitted.
      - name: Docs links resolve
        run: npm run check:links
