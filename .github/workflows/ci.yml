name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm install

      # The token CSS is generated from src/tokens/tokens.ts but committed, so
      # that kern stays source-only with no build step for consumers. This is
      # what keeps the committed copy honest.
      - name: Check token CSS is in sync
        run: npm run tokens:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook

      # Story IDs come from the export name, not the displayed name, so a
      # hand-written docs link can look right and 404. Checked against the
      # index.json the build just emitted.
      - name: Check docs links resolve
        run: npm run check:links
