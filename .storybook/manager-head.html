<script>
  /* Storybook titles every page "<story> - Docs ⋅ Storybook", and the static
     page "storybook - Storybook", so neither a tab nor a search result says
     which Storybook this is. Name the system instead, whichever story is open. */
  (function () {
    var name = 'kern'
    var home = 'kern: a component library and design tokens'
    function rename() {
      var t = document.title
      var next = t === 'storybook - Storybook' || t === 'Storybook' ? home : t.replace('⋅ Storybook', '⋅ ' + name)
      if (next !== t) document.title = next
    }
    // Storybook writes its own <html lang="en">; the copy is Australian English.
    document.documentElement.lang = 'en-AU'
    rename()
    new MutationObserver(rename).observe(document.head, { childList: true, subtree: true, characterData: true })
  })()
</script>
